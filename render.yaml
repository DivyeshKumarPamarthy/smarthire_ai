# SmartHire AI — Render blueprint
#
# Apply with Render's "Blueprint" flow, which reads this file and creates every
# resource below. Nothing here deploys on its own; see
# docs/DEPLOYMENT-CHECKLIST.md, which has to be worked through in order because
# this repository has no migration framework.
#
# Why Render at all: this app needs real WebSockets held open for the length of
# an interview, and a managed Postgres. It also wants a persistent disk for
# candidate recordings — Render offers one, and this deployment deliberately
# does without it to stay on the free tier. Uploads therefore do not survive a
# restart. That is a known, accepted cost recorded in the checklist, not an
# oversight; the trade is documented at the disk block below.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: smarthire-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free             # no persistent disk on this tier — see the note below

    # Load-bearing, not a performance setting. metrics.py and ai_metrics.py
    # keep their counters in process memory, so a second instance splits the
    # admin dashboard's view of the platform rather than sharing it. Scale up,
    # not out, until those counters live somewhere shared.
    numInstances: 1

    healthCheckPath: /api/health

    # NO PERSISTENT DISK — deliberate, see docs/DEPLOYMENT-CHECKLIST.md
    # (2026-09-13). Uploads land on the container's own filesystem and are lost
    # on every restart, redeploy and free-tier spin-down. The app creates the
    # upload directories on first write, so a fresh container works; it simply
    # starts empty. Re-adding a disk later is this block plus a paid instance
    # and needs no code change — the upload paths are already correct:
    #
    #   disk:
    #     name: smarthire-uploads
    #     mountPath: /app/uploads    # must match WORKDIR in backend/Dockerfile
    #     sizeGB: 1

    envVars:
      - key: ENVIRONMENT
        value: production          # makes a missing JWT_SECRET_KEY a startup error

      # Set in the dashboard, never in this file — it is committed.
      - key: JWT_SECRET_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: smarthire-db
          property: connectionString

      # Both must be the real deployed frontend origin. Left at localhost, the
      # browser blocks every API call and the app looks broken with no
      # server-side error to find.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smarthire-web
          property: host
      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: smarthire-web
          property: host

      # --- AI: decide before going live, see the checklist ---
      # Gemini's free tier is 20 requests/day and Module 5 spends one per
      # answer. Either add billing, list extra keys in GEMINI_API_KEYS, or set
      # ANALYSE_ANSWERS=false and run without transcription.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: ANALYSE_ANSWERS
        value: "true"

      # --- email: inert until SMTP_HOST is set ---
      # Notifications are still recorded and shown in-app without this; they
      # are marked "not emailed" rather than silently dropped.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  # --------------------------------------------------------------- frontend
  # A native static site rather than the container in frontend/Dockerfile:
  # free, CDN-backed, and there is no process to keep alive. That Dockerfile is
  # kept for hosts without a static-site product.
  - type: web
    name: smarthire-web
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    # Relative to rootDir, NOT the repo root. Render's Monorepo Support docs
    # list the publish directory among the fields resolved against the root
    # directory once one is set; the general Blueprint reference describes the
    # no-rootDir case and reads as though it were repo-relative, which is the
    # trap. With rootDir: ./frontend, "./frontend/dist" resolves to
    # frontend/frontend/dist — a path that does not exist, and the build fails
    # looking for it. `vite build` writes to frontend/dist, so from rootDir
    # that is ./dist.
    staticPublishPath: ./dist

    envVars:
      # Set in the dashboard, the same way JWT_SECRET_KEY and GEMINI_API_KEY
      # are on the API service.
      #
      # NOT fromService/property: host. That returns the service's bare
      # hostname on Render's *private* network — no scheme, no path, and not
      # an address a browser can reach. api.js expects a full origin plus the
      # API prefix, as its own fallback shows:
      #
      #     import.meta.env.VITE_API_URL ?? 'http://localhost:8000/api'
      #
      # There is no fromService property that yields a complete URL —
      # `hostport` is the closest and still has no scheme — so this has to be
      # set by hand. Use the API service's public origin:
      #
      #     https://smarthire-api.onrender.com/api
      #
      # Baked into the bundle at build time by Vite, not read at runtime, so
      # changing it requires a rebuild rather than a restart.
      - key: VITE_API_URL
        sync: false

    routes:
      # Single-page app: every path serves index.html, or a refresh on
      # /candidate#history 404s before React is reached.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smarthire-db
    databaseName: smarthire
    # FREE TIER, AND IT HAS A DELETION DATE — see docs/DEPLOYMENT-CHECKLIST.md
    # (2026-09-13). Unlike the missing disk, this is not a standing tradeoff to
    # accept once: a free Render Postgres expires 30 days after creation, then
    # allows 14 days' grace to upgrade, and is deleted with all of its data
    # after that. Scores, transcripts, reports and every user account live
    # here. Upgrading to a paid plan during the grace period preserves the
    # database in place — the checklist has the dates and the procedure.
    #
    # "free" is Render's own identifier for the 0.1 CPU / 256 MB plan
    # ("0.1c-256mb" is the equivalent alias).
    plan: free
    # Postgres, matching local development. The SQLite fallback in config.py is
    # for local convenience only — it has no place on a deployment that holds
    # more than one candidate's data.
